name: Release APK + AAB (Google Play)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > android/key.jks
          echo "storeFile=../key.jks" > android/key.properties
          echo "keyAlias=release" >> android/key.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> android/key.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate config.dart
        run: |
          cat > lib/config.dart << EOF
          class AppConfig {
            static const String appId = '${{ secrets.APP_ID }}';
            static const String secretKey = '${{ secrets.SECRET_KEY }}';
            static const String yandexVisionApiKey = '${{ secrets.YANDEX_API_KEY }}';
            static const String yandexFolderId = '${{ secrets.YANDEX_FOLDER_ID }}';
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release, for Google Play)
        run: flutter build appbundle --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          body: 'Исправления и улучшения.'

      # Опциональная авто-загрузка в Google Play. Срабатывает только если в
      # настройках репозитория добавлен секрет PLAY_SERVICE_ACCOUNT_JSON
      # (JSON service-аккаунта с доступом к Play Console). Иначе шаг пропускается,
      # а готовый .aab уже лежит в GitHub-релизе для ручной заливки.
      - name: Upload to Google Play (optional)
        if: ${{ env.PLAY_SA != '' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.easyfinance.app
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: internal
          status: draft
