plugins {
    id "com.android.application"
    id "kotlin-android" // ОБЯЗАТЕЛЬНО ДОБАВИТЬ!
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.easyfinance.app"
    compileSdk = 36 // Обновил до 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Идентичность приложения в Google Play. Play-консоль потребовала
        // именно com.EasyFinance (запись в магазине создана под этим именем).
        // НЕ путать с namespace выше: namespace — это пакет Kotlin/R-классов,
        // по нему разрешается .MainActivity в манифесте.
        applicationId = "com.EasyFinance"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36 // Обновил до 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions = ["distribution"]

    productFlavors {
        play {
            dimension = "distribution"
        }
        direct {
            dimension = "distribution"
        }
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias'] ?: 'release'
            keyPassword = keystoreProperties['keyPassword'] ?: ''
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword'] ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
